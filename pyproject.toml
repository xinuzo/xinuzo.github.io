[project]
name = "xinuzo-github-io"
version = "1.0.0"
description = "Static website for xinuzo.github.io"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.1.50",
    "jinja2>=3.1.6",
    "markdown-it-pyrs>=0.4.0",
    "python-frontmatter>=1.1.0",
]

[tool.ruff]
line-length = 100

[tool.codespell]
ignore-words-list = "nd"

[dependency-groups]
dev = [
    "codespell>=2.4.2",
    "prek>=0.3.11",
    "ruff>=0.15.0",
]
