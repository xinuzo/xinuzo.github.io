[project]
name = "blog-xinuzo"
version = "0.1.0"
description = "Personal blog — Math, code, and everything in between"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",
    "mdx-truly-sane-lists>=1.3",
    "pelican-katex>=1.8.6",
    "pelican-redirect>=3.0.0",
    "pelican-seo>=1.4.0",
    "pelican[markdown]>=4.12.0",
]

[dependency-groups]
dev = [
    "djlint>=1.36.4",
    "prek>=0.4.1",
    "ruff>=0.15.0",
]

[tool.djlint]
profile = "jinja"
ignore = "H006"

[tool.ruff.lint]
ignore = ["E731"]

[tool.codespell]
ignore-words-list = "nd"
